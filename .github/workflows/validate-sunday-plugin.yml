name: Validate Sunday plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugins/sunday/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - 'tests/test_sunday_plugin.py'
      - '.github/workflows/validate-sunday-plugin.yml'
  pull_request:
    paths:
      - 'plugins/sunday/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - 'tests/test_sunday_plugin.py'
      - '.github/workflows/validate-sunday-plugin.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Sunday package and catalog
        run: python3 -m unittest discover -s tests -p 'test_sunday_plugin.py' -v
